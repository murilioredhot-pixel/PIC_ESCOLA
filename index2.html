<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagrão · O Amor nos Tempos do Blog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ig-pink: #e1306c;
            --ig-purple: #833ab4;
            --ig-blue: #405de6;
            --ig-black: #262626;
            --ig-gray: #8e8e8e;
            --ig-light: #fafafa;
            --ig-border: #dbdbdb;
            --ig-soft: #efefef;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--ig-light);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 12px 0;
            color: var(--ig-black);
        }

        .app {
            max-width: 480px;
            width: 100%;
            background: white;
            border: 1px solid var(--ig-border);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            box-shadow: var(--shadow);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--ig-border);
            background: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-family: 'Brush Script MT', 'Segoe Script', cursive;
            font-size: 30px;
            font-weight: 500;
            letter-spacing: -1px;
            color: var(--ig-black);
        }
        .logo span { color: var(--ig-pink); }

        .header-icons {
            display: flex;
            gap: 18px;
            font-size: 22px;
            color: var(--ig-black);
        }
        .header-icons i {
            cursor: pointer;
            transition: color 0.2s, transform 0.15s;
        }
        .header-icons i:hover { color: var(--ig-pink); }
        .header-icons i:active { transform: scale(0.9); }

        /* Stories */
        .stories-container {
            display: flex;
            gap: 14px;
            padding: 14px 16px;
            overflow-x: auto;
            border-bottom: 1px solid var(--ig-soft);
            scrollbar-width: thin;
        }
        .stories-container::-webkit-scrollbar { height: 4px; }
        .stories-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

        .story {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 74px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .story-ring {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-radius: 50%;
            padding: 3px;
            margin-bottom: 5px;
            transition: transform 0.2s;
        }
        .story:hover .story-ring { transform: scale(1.06); }

        .story-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2.5px solid white;
            background: #eee;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .story-avatar svg { width: 100%; height: 100%; }

        .story-name {
            font-size: 11px;
            color: var(--ig-black);
            text-align: center;
            max-width: 72px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Feed */
        .feed { padding: 6px 0 70px; }

        .post {
            border-bottom: 1px solid var(--ig-soft);
            margin-bottom: 10px;
            padding-bottom: 14px;
        }

        .post-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
        }

        .post-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }
        .post-avatar svg { width: 100%; height: 100%; }

        .post-user {
            font-weight: 600;
            font-size: 14px;
        }
        .post-location {
            font-size: 11px;
            color: var(--ig-gray);
            margin-top: 1px;
        }

        .post-image {
            width: 100%;
            height: 340px;
            overflow: hidden;
            background: #e8e8e8;
            position: relative;
            cursor: pointer;
        }
        .post-image svg { width: 100%; height: 100%; display: block; }

        .like-heart-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .like-heart-overlay.show {
            opacity: 1;
            animation: heartPop 0.7s ease-out forwards;
        }
        @keyframes heartPop {
            0% { transform: scale(0.3); opacity: 0.9; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .like-heart-overlay i {
            font-size: 90px;
            color: white;
            text-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }

        .post-actions {
            display: flex;
            padding: 10px 16px 4px;
            gap: 16px;
            font-size: 24px;
            color: var(--ig-black);
        }
        .post-actions i {
            cursor: pointer;
            transition: transform 0.15s, color 0.2s;
        }
        .post-actions i:active { transform: scale(0.85); }
        .post-actions .liked { color: var(--ig-pink); }

        .post-likes {
            font-weight: 600;
            font-size: 13.5px;
            padding: 2px 16px 6px;
        }

        .post-caption {
            padding: 0 16px;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 6px;
        }
        .post-caption .user { font-weight: 600; margin-right: 4px; }

        .comments {
            padding: 0 16px;
            font-size: 13.5px;
        }
        .comment { margin-top: 4px; line-height: 1.35; }
        .comment .user {
            font-weight: 600;
            color: var(--ig-black);
            margin-right: 5px;
        }

        .pinned-comment {
            background: linear-gradient(90deg, #fff8e6, #fffdf5);
            padding: 8px 12px;
            border-radius: 10px;
            margin-top: 8px;
            border-left: 3px solid #e6a817;
            font-size: 13px;
            color: #333;
        }
        .pinned-comment .user { font-weight: 700; }
        .pinned-label {
            font-size: 10px;
            background: #e6a817;
            color: white;
            padding: 2px 7px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 500;
            vertical-align: middle;
        }

        .view-all-comments {
            color: var(--ig-gray);
            cursor: pointer;
            margin-top: 8px;
            display: inline-block;
            font-size: 13px;
            transition: color 0.2s;
        }
        .view-all-comments:hover { color: var(--ig-black); }

        /* Bottom nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0;
            border-top: 1px solid var(--ig-border);
            background: white;
            font-size: 24px;
            color: var(--ig-black);
            position: sticky;
            bottom: 0;
            z-index: 10;
        }
        .bottom-nav i { cursor: pointer; transition: color 0.2s; }
        .bottom-nav .active { color: var(--ig-blue); }
        .bottom-nav i:hover { color: var(--ig-pink); }

        /* Painéis */
        .messages-panel, .profile-panel, .comments-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 480px;
            max-width: 95vw;
            max-height: 85vh;
            background: white;
            z-index: 100;
            display: none;
            flex-direction: column;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            border: 1px solid var(--ig-border);
            overflow: hidden;
        }

        .messages-panel, .profile-panel {
            padding: 18px;
            overflow-y: auto;
        }

        .close-btn {
            align-self: flex-end;
            font-size: 24px;
            cursor: pointer;
            color: var(--ig-black);
            margin-bottom: 8px;
            transition: color 0.2s;
        }
        .close-btn:hover { color: var(--ig-pink); }

        .messages-panel h2 {
            font-size: 20px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .conversation {
            border: 1px solid var(--ig-soft);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
            background: #fcfcfc;
        }
        .conversation-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .conversation-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
        }
        .conversation-avatar svg { width: 100%; height: 100%; }

        .messages { display: flex; flex-direction: column; gap: 7px; }
        .message {
            max-width: 82%;
            padding: 9px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }
        .message.received {
            background: var(--ig-soft);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.sent {
            background: var(--ig-blue);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* Perfil */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 20px;
        }
        .profile-pic {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--ig-border);
        }
        .profile-pic svg { width: 100%; height: 100%; }

        .profile-stats {
            display: flex;
            gap: 22px;
            font-size: 14px;
            text-align: center;
        }
        .profile-stats span {
            font-weight: 700;
            display: block;
            font-size: 17px;
        }

        .profile-bio {
            font-size: 14px;
            line-height: 1.45;
            margin-bottom: 18px;
        }
        .profile-bio .name {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .profile-posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }
        .profile-post-thumb {
            aspect-ratio: 1;
            overflow: hidden;
            background: #eee;
        }
        .profile-post-thumb svg { width: 100%; height: 100%; display: block; }

        /* Modal Comentários */
        .comments-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--ig-soft);
            font-weight: 600;
            font-size: 15px;
        }
        .comments-modal-header .close-btn { margin: 0; font-size: 20px; }

        .comments-modal-list {
            overflow-y: auto;
            padding: 16px;
            flex: 1;
            max-height: 60vh;
        }
        .comments-modal-list .comment {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            font-size: 14px;
        }
        .comment-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }
        .comment-avatar svg { width: 100%; height: 100%; }
        .comment-content .user { font-weight: 600; margin-right: 5px; }
        .comment-content .time {
            font-size: 11px;
            color: var(--ig-gray);
            margin-top: 3px;
        }

        /* Story Viewer */
        .story-viewer {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;

            justify-content: center;
        }

        .progress-bar {
            position: absolute;
            top: 16px;
            left: 12px;
            right: 12px;
            display: flex;
            gap: 4px;
            z-index: 3;
        }
        .progress-segment {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-segment .fill {
            height: 100%;
            width: 0%;
            background: white;
            transition: width 0.05s linear;
        }

        .story-header {
            position: absolute;
            top: 32px;
            left: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            z-index: 3;
        }
        .story-header .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid white;
        }
        .story-header .avatar svg { width: 100%; height: 100%; }
        .story-header .name { font-weight: 600; font-size: 14px; }
        .story-header .time { font-size: 11px; opacity: 0.8; }

        .close-story {
            position: absolute;
            top: 26px;
            right: 18px;
            font-size: 28px;
            color: white;
            cursor: pointer;
            z-index: 3;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .story-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            z-index: 3;
            padding: 20px 12px;
            transition: color 0.2s;
        }
        .story-nav:hover { color: white; }
        .story-nav.prev { left: 8px; }
        .story-nav.next { right: 8px; }

        .story-content {
            width: 100%;
            max-width: 420px;
            height: 78vh;
            max-height: 780px;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .story-content svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .story-caption {
            position: absolute;
            bottom: 28px;
            left: 18px;
            right: 18px;
            color: white;
            font-size: 15px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.7);
            z-index: 2;
            line-height: 1.35;
        }

        /* Overlay & Toast */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 90;
            display: none;
        }
        .overlay.active { display: block; }

        .toast {
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 11px 22px;
            border-radius: 24px;
            font-size: 14px;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* Hint */
        .keyboard-hint {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- Header -->
        <div class="header">
            <div class="logo">Insta<span>grão</span></div>
            <div class="header-icons">
                <i class="far fa-heart" title="Atividade"></i>
                <i class="far fa-paper-plane" id="messagesIcon" title="Mensagens"></i>
            </div>
        </div>

        <!-- Stories -->
        <div class="stories-container" id="storiesContainer"></div>

        <!-- Feed -->
        <div class="feed" id="feed"></div>

        <!-- Bottom nav -->
        <div class="bottom-nav">
            <i class="fas fa-home active" title="Início"></i>
            <i class="far fa-search" title="Pesquisar"></i>
            <i class="far fa-plus-square" title="Criar"></i>
            <i class="far fa-heart" title="Reels"></i>
            <i class="far fa-user" id="profileIcon" title="Perfil"></i>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <!-- Mensagens -->
    <div class="messages-panel" id="messagesPanel">
        <div class="close-btn" id="closeMessages"><i class="fas fa-times"></i></div>
        <h2><i class="far fa-paper-plane"></i> Mensagens</h2>
        <div id="conversations"></div>
    </div>

    <!-- Perfil -->
    <div class="profile-panel" id="profilePanel">
        <div class="close-btn" id="closeProfile"><i class="fas fa-times"></i></div>
        <div class="profile-header">
            <div class="profile-pic" id="profilePic"></div>
            <div class="profile-stats">
                <div><span>47</span>posts</div>
                <div><span>892</span>seguidores</div>
                <div><span>314</span>seguindo</div>
            </div>
        </div>
        <div class="profile-bio">
            <div class="name">João Pedro</div>
            Estudante · Leitor de romances e blogs antigos<br>
            📖 Apaixonado por <em>O Amor nos Tempos do Blog</em><br>
            💻 “Escrever é a única maneira de fazer com que os outros me escutem.”<br>
            📍 São Paulo, Brasil
        </div>
        <div class="profile-posts-grid" id="profileGrid"></div>
    </div>

    <!-- Modal Comentários -->
    <div class="comments-modal" id="commentsModal">
        <div class="comments-modal-header">
            <span>Comentários</span>
            <i class="fas fa-times close-btn" id="closeCommentsModal"></i>
        </div>
        <div class="comments-modal-list" id="commentsModalList"></div>
    </div>

    <!-- Story Viewer -->
    <div class="story-viewer" id="storyViewer">
        <div class="progress-bar" id="storyProgress"></div>
        <div class="story-header" id="storyHeader"></div>
        <i class="fas fa-times close-story" id="closeStory"></i>
        <div class="story-nav prev" id="prevStory"><i class="fas fa-chevron-left"></i></div>
        <div class="story-nav next" id="nextStory"><i class="fas fa-chevron-right"></i></div>
        <div class="story-content" id="storyContent"></div>
        <div class="story-caption" id="storyCaption"></div>
        <div class="keyboard-hint">← → para navegar · Esc para fechar</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // SVG AVATARES E ILUSTRAÇÕES (estilo editorial / ilustração)
        // ============================================================

                </defs>

        }

        function svgAvatarDeusa() {
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bgDeusa" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#f9c5d1"/>
                        <stop offset="100%" stop-color="#e1306c"/>
                    </linearGradient>
                    <linearGradient id="hairDeusa" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#3d1c1c"/>
                        <stop offset="100%" stop-color="#6b2d2d"/>
                    </linearGradient>
                </defs>
                <rect width="100" height="100" fill="url(#bgDeusa)"/>
                <ellipse cx="50" cy="55" rx="32" ry="40" fill="url(#hairDeusa)"/>
                <ellipse cx="50" cy="52" rx="24" ry="26" fill="#f5d0b8"/>
                <path d="M26 40 Q30 20 50 22 Q70 20 74 40 Q68 34 50 36 Q32 34 26 40Z" fill="url(#hairDeusa)"/>
                <ellipse cx="41" cy="50" rx="3.5" ry="4.5" fill="#2b1a0e"/>
                <ellipse cx="59" cy="50" rx="3.5" ry="4.5" fill="#2b1a0e"/>
                <circle cx="42" cy="49" r="1.2" fill="white"/>
                <circle cx="60" cy="49" r="1.2" fill="white"/>
                <circle cx="36" cy="58" r="4" fill="#f0a0a0" opacity="0.5"/>
                <circle cx="64" cy="58" r="4" fill="#f0a0a0" opacity="0.5"/>
                <path d="M43 63 Q50 69 57 63" stroke="#b04a4a" stroke-width="2" fill="none" stroke-linecap="round"/>
                <circle cx="24" cy="58" r="2.2" fill="#ffd700"/>
                <circle cx="76" cy="58" r="2.2" fill="#ffd700"/>
            </svg>`;
        }

        function svgAvatarCinderela() {
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bgCin" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#d4fc79"/>
                        <stop offset="100%" stop-color="#96e6a1"/>
                    </linearGradient>
                </defs>
                <rect width="100" height="100" fill="url(#bgCin)"/>
                <circle cx="30" cy="40" r="16" fill="#7a4a1a"/>
                <circle cx="70" cy="40" r="16" fill="#7a4a1a"/>
                <circle cx="50" cy="30" r="18" fill="#8a5a2a"/>
                <circle cx="26" cy="58" r="12" fill="#7a4a1a"/>

                    { user: 'cinderela_virtual', avatar: svgAvatarCinderela(), text: 'O amor nos tempos do blog ainda vive!', time: '1h' },
                    { user: 'deusa_cibernetica', avatar: svgAvatarDeusa(), text: 'Trabalho escolar dos sonhos 😍', time: '40min' }
                ]
            }
        ];

        const conversationsData = [
            {
                name: 'Ariza em Silêncio',
                avatar: svgAvatarAriza(),
                messages: [
                    { text: 'Oi. Você também leu o livro?', sent: false },
                    { text: 'Li sim! Foi um dos que mais me marcou. A parte da biblioteca...', sent: true },
                    { text: 'Escrever ainda é a única forma que tenho de ser realmente ouvido.', sent: false },
                    { text: 'E a Cinderela? Vocês ainda se falam?', sent: true },
                    { text: 'Às vezes. Alguns silêncios são mais eloquentes que qualquer post.', sent: false }
                ]
            },
            {
                name: 'Deusa Cibernética',
                avatar: svgAvatarDeusa(),
                messages: [
                    { text: 'E aí, fã do livro! 😉', sent: false },
                    { text: 'Haha oi! Adoro a sua energia no blog.', sent: true },
                    { text: 'Ser popular é fácil. Ser verdadeira... aí já é outra história.', sent: false },
                    { text: 'Você e a Cinderela têm uma relação complicada, né?', sent: true },
                    { text: 'Irmãs gêmeas. O amor e o ciúme andam de mãos dadas às vezes.', sent: false }
                ]
            },
            {
                name: 'Cinderela Virtual',
                avatar: svgAvatarCinderela(),
                messages: [
                    { text: 'Oi João Pedro! Vi que você gostou do livro 💕', sent: false },
                    { text: 'Amei! A conexão entre os três blogs é genial.', sent: true },
                    { text: 'Acreditar no amor nunca foi bobagem. Mesmo nos tempos do blog.', sent: false },
                    { text: 'Você ainda escreve?', sent: true },
                    { text: 'Sempre. Alguns sentimentos só existem quando são escritos.', sent: false }
                ]
            }
        ];

        // ============================================================
        // RENDER
        // ============================================================

        // Stories
        const storiesContainer = document.getElementById('storiesContainer');
        storiesData.forEach((story, index) => {
            const div = document.createElement('div');
            div.className = 'story';
            div.innerHTML = `
                <div class="story-ring">
                    <div class="story-avatar">${story.avatar}</div>
                </div>
                <span class="story-name">${story.name}</span>
            `;
            div.addEventListener('click', () => openStory(index));
            storiesContainer.appendChild(div);
        });

        // Feed
        const feed = document.getElementById('feed');
        postsData.forEach(post => {
            const postEl = document.createElement('div');
            postEl.className = 'post';
            postEl.dataset.postId = post.id;

            const visibleComments = post.comments.slice(0, 3);
            const hasMore = post.comments.length > 3;

            postEl.innerHTML = `
                <div class="post-header">
                    <div class="post-avatar">${post.avatar}</div>
                    <div>
                        <div class="post-user">${post.user}</div>
                        <div class="post-location">${post.location}</div>
                    </div>
                </div>
                <div class="post-image" data-post-id="${post.id}">
                    ${post.image}
                    <div class="like-heart-overlay"><i class="fas fa-heart"></i></div>
                </div>
                <div class="post-actions">
                    <i class="far fa-heart like-btn" data-post-id="${post.id}"></i>
                    <i class="far fa-comment comment-btn" data-post-id="${post.id}"></i>
                    <i class="far fa-paper-plane"></i>
                    <i class="far fa-bookmark" style="margin-left:auto"></i>
                </div>
                <div class="post-likes">${post.likes} curtidas</div>
                <div class="post-caption">
                    <span class="user">${post.user}</span> ${post.caption}
                </div>
                <div class="comments">
                    ${visibleComments.map(c => {
                        if (c.pinned) {
                            return `<div class="pinned-comment"><span class="user">${c.user}</span> ${c.text} <span class="pinned-label">📌 fixado</span></div>`;
                        }
                        return `<div class="comment"><span class="user">${c.user}</span> ${c.text}</div>`;
                    }).join('')}
                    ${hasMore ? `<span class="view-all-comments" data-post-id="${post.id}">Ver todos os ${post.comments.length} comentários</span>` : ''}
                </div>
            `;
            feed.appendChild(postEl);
        });

        // ============================================================
        // INTERAÇÕES
        // ============================================================

        // Like por botão
        document.querySelectorAll('.like-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                this.classList.toggle('fas');
                this.classList.toggle('far');
                this.classList.toggle('liked');
                if (this.classList.contains('liked')) {
                    showToast('Curtido ❤️');
                }
            });
        });

        // Duplo clique na imagem para curtir
        document.querySelectorAll('.post-image').forEach(img => {
            let lastTap = 0;
            img.addEventListener('click', function (e) {
                const now = Date.now();
                if (now - lastTap < 300) {
                    const postId = this.dataset.postId;
                    const btn = document.querySelector(`.like-btn[data-post-id="${postId}"]`);
                    if (btn && !btn.classList.contains('liked')) {
                        btn.classList.add('fas', 'liked');
                        btn.classList.remove('far');
                    }
                    const overlay = this.querySelector('.like-heart-overlay');
                    overlay.classList.remove('show');
                    void overlay.offsetWidth;
                    overlay.classList.add('show');
                    showToast('Curtido ❤️');
                }
                lastTap = now;
            });
        });

        // Comentários modal
        const commentsModal = document.getElementById('commentsModal');
        const commentsModalList = document.getElementById('commentsModalList');
        const overlay = document.getElementById('overlay');

        function openCommentsModal(postId) {
            const post = postsData.find(p => p.id === parseInt(postId));
            if (!post) return;
            commentsModalList.innerHTML = post.comments.map(c => `
                <div class="comment">
                    <div class="comment-avatar">${c.avatar}</div>
                    <div class="comment-content">
                        <div><span class="user">${c.user}</span> ${c.text} ${c.pinned ? '📌' : ''}</div>
                        <div class="time">${c.time || 'agora'}</div>
                    </div>
                </div>
            `).join('');
            commentsModal.style.display = 'flex';
            overlay.classList.add('active');
        }

        function closeCommentsModalFn() {
            commentsModal.style.display = 'none';
            overlay.classList.remove('active');
        }

        document.getElementById('closeCommentsModal').addEventListener('click', closeCommentsModalFn);
        overlay.addEventListener('click', () => {
            closeCommentsModalFn();
            closeMessagesPanel();
            closeProfilePanel();
        });

        document.addEventListener('click', (e) => {
            const commentBtn = e.target.closest('.comment-btn');
            const viewAllBtn = e.target.closest('.view-all-comments');
            if (commentBtn) openCommentsModal(commentBtn.dataset.postId);
            if (viewAllBtn) openCommentsModal(viewAllBtn.dataset.postId);
        });

        // Mensagens
        const messagesPanel = document.getElementById('messagesPanel');
        const conversationsEl = document.getElementById('conversations');

        conversationsData.forEach(conv => {
            const convEl = document.createElement('div');
            convEl.className = 'conversation';
            convEl.innerHTML = `
                <div class="conversation-header">
                    <div class="conversation-avatar">${conv.avatar}</div>
                    <span>${conv.name}</span>
                </div>
                <div class="messages">
                    ${conv.messages.map(m => `<div class="message ${m.sent ? 'sent' : 'received'}">${m.text}</div>`).join('')}
                </div>
            `;
            conversationsEl.appendChild(convEl);
        });

        function openMessagesPanel() {
            messagesPanel.style.display = 'flex';
            profilePanel.style.display = 'none';
            overlay.classList.add('active');
        }
        function closeMessagesPanel() {
            messagesPanel.style.display = 'none';
            if (profilePanel.style.display !== 'flex') overlay.classList.remove('active');
        }
        document.getElementById('messagesIcon').addEventListener('click', openMessagesPanel);
        document.getElementById('closeMessages').addEventListener('click', closeMessagesPanel);

        // Perfil
        const profilePanel = document.getElementById('profilePanel');
        const profilePic = document.getElementById('profilePic');
        const profileGrid = document.getElementById('profileGrid');

        profilePic.innerHTML = svgAvatarJoao();
        for (let i = 0; i < 6; i++) {
            const div = document.createElement('div');
            div.className = 'profile-post-thumb';
            div.innerHTML = svgProfileThumb(i);
            profileGrid.appendChild(div);
        }

        function openProfilePanel() {
            profilePanel.style.display = 'flex';
            messagesPanel.style.display = 'none';
            overlay.classList.add('active');
        }
        function closeProfilePanel() {
            profilePanel.style.display = 'none';
            if (messagesPanel.style.display !== 'flex') overlay.classList.remove('active');
        }
        document.getElementById('profileIcon').addEventListener('click', openProfilePanel);
        document.getElementById('closeProfile').addEventListener('click', closeProfilePanel);

        // ============================================================
        // STORY VIEWER + TECLADO
        // ============================================================

        const storyViewer = document.getElementById('storyViewer');
        const storyProgress = document.getElementById('storyProgress');
        const storyHeader = document.getElementById('storyHeader');
        const storyContent = document.getElementById('storyContent');
        const storyCaption = document.getElementById('storyCaption');

        let currentStoryIndex = 0;
        let storyTimer = null;
        const STORY_DURATION = 5500;

        function openStory(index) {
            currentStoryIndex = index;
            storyViewer.style.display = 'flex';
            showStory();
        }

        function showStory() {
            const story = storiesData[currentStoryIndex];
            storyProgress.innerHTML = storiesData.map((_, i) => `
                <div class="progress-segment">
                    <div class="fill" style="width: ${i < currentStoryIndex ? '100%' : '0%'};"></div>
                </div>
            `).join('');

            storyHeader.innerHTML = `
                <div class="avatar">${story.avatar}</div>
                <div>
                    <div class="name">${story.name}</div>
                    <div class="time">${Math.floor(Math.random() * 11) + 1}h atrás</div>
                </div>
            `;
            storyContent.innerHTML = story.story;
            storyCaption.textContent = story.caption;

            if (storyTimer) clearTimeout(storyTimer);
            const currentSegment = storyProgress.children[currentStoryIndex];
            const fill = currentSegment.querySelector('.fill');
            fill.style.width = '0%';
            fill.offsetHeight;
            fill.style.transition = `width ${STORY_DURATION}ms linear`;
            fill.style.width = '100%';

            storyTimer = setTimeout(nextStory, STORY_DURATION);
        }

        function nextStory() {
            if (storyTimer) clearTimeout(storyTimer);
            if (currentStoryIndex < storiesData.length - 1) {
                currentStoryIndex++;
                showStory();
            } else {
                closeStoryViewer();
            }
        }

        function prevStory() {
            if (storyTimer) clearTimeout(storyTimer);
            if (currentStoryIndex > 0) {
                currentStoryIndex--;
                showStory();
            }
        }

        function closeStoryViewer() {
            storyViewer.style.display = 'none';
            if (storyTimer) clearTimeout(storyTimer);
        }

        document.getElementById('closeStory').addEventListener('click', closeStoryViewer);
        document.getElementById('nextStory').addEventListener('click', nextStory);
        document.getElementById('prevStory').addEventListener('click', prevStory);

        storyContent.addEventListener('click', (e) => {
            if (e.target.closest('.close-story') || e.target.closest('.story-nav')) return;
            nextStory();
        });

        // Teclado
        document.addEventListener('keydown', (e) => {
            if (storyViewer.style.display === 'flex') {
                if (e.key === 'ArrowRight' || e.key === ' ') {
                    e.preventDefault();
                    nextStory();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    prevStory();
                } else if (e.key === 'Escape') {
                    closeStoryViewer();
                }
            } else if (e.key === 'Escape') {
                closeCommentsModalFn();
                closeMessagesPanel();
                closeProfilePanel();
            }
        });

        // Toast
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }
    </script>
</body>
</html>
